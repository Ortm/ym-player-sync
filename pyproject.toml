[project]
name = "ym-player-sync"
version = "0.6.0"
description = "Mirror a Yandex Music playlist onto a USB music player"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "yandex-music",
  "playlist",
  "download",
  "usb",
  "mp3",
  "flac",
  "cli",
]
authors = [{ name = "Vix" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "pycryptodome>=3.20",
  "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
ym-player-sync = "ym_player_sync.cli:main"

[project.urls]
Repository = "https://github.com/Ortm/ym-player-sync"
Issues = "https://github.com/Ortm/ym-player-sync/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ym_player_sync"]

[dependency-groups]
dev = ["pytest>=8.0"]
