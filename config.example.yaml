# ym-player-sync configuration.
#
# `ym-player-sync init` writes this file with the defaults; fill in the
# playlist, the token and the player path, then run `ym-player-sync info`.
#
# Where it is looked for: --config <path>, then ./config/config.yaml,
# then ./config.yaml (older checkouts), then
# ~/.config/ym-player-sync/config.yaml (where the Home Manager module
# puts it). ${VAR} in any value is expanded from the environment (an
# unset variable expands to nothing).

# Playlist to mirror. Also accepts the Liked-tracks collection
# (…/users/<login>/tracks) and share links (…/playlists/<uid>.<uuid>).
playlist_url: "https://music.yandex.ru/users/<login>/playlists/<kind>"

# Yandex Music token: uncomment one. A file holding the bare token or a
# YM_TOKEN=... line (what agenix/sops-nix write) keeps the secret out of
# this config; the YM_TOKEN environment variable also works.
# token_file: "~/.config/sops-nix/secrets/ym-token"
# token: "y0_..."

# Download tier. Files are kept exactly as downloaded (no transcoding):
#   lossless - FLAC, biggest, no quality loss (needs Yandex Plus/Premium)
#   high     - MP3 320 kbps
#   low      - smallest available variant (e.g. AAC/MP3 low bitrate, .m4a/.mp3)
quality: lossless

# Music source. Null (or omitted) auto-detects from the playlist URL.
source: null

# Tag the downloaded files (artist/title/album/…) and embed the cover,
# so players show what is playing instead of a file name.
tags: true
embed_cover: true

# Limits (null = no limit). max_tracks trims the playlist; max_total_mb
# budgets the cache: estimates first, then a hard stop on real bytes.
max_tracks: null
max_total_mb: 6000

# Local staging dir (cache + sync state live here). Relative paths are
# resolved against this file's directory, so "../music" keeps the cache
# inside a checkout; an absolute path (or ~/…) works anywhere.
output_dir: "../music"

# Mounted player; the sync stage mirrors the cache into its Music/ dir.
player_dir: "/run/media/<user>/<label>/Music"

# {position} is the 1-based playlist position, zero-padded to {width}
# digits. {title} is the track name, {artists} the artist(s), {ext} the
# downloaded codec; {name} ("Title - Artist") is also available.
filename_template: "{position:0{width}d}-{title} - {artists}.{ext}"

# Parallel downloads on the download stage.
workers: 4
